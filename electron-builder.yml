appId: com.deepseek.harness-desktop
productName: Deepseek
# 产物命名含平台与架构，便区分单架构包（${name} 即 package.json name：deepseek-harness-desktop）
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/runtime
    to: runtime
    filter:
      # 运行时只需可执行文件与 JS 资产：排除文档/ sourcemap / 测试与示例目录，
      # 以及 dsh 目录下的 package-lock（安装期产物，运行时不需要）
      - "**/*"
      - "!**/*.md"
      - "!**/*.map"
      - "!**/{test,tests,__tests__,docs,example,examples}/**"
      - "!dsh/package-lock.json"
asar: true
asarUnpack: []
mac:
  category: public.app-category.developer-tools
  # arch 由 CLI（--arm64/--x64）控制，dist 脚本已按单架构瘦身运行时
  target:
    - dmg
  icon: build/icon.icns
  # ad-hoc 签名（identity: '-'）：免费、无需开发者账号。相比完全无签名，
  # 可避免 Gatekeeper 把应用判为「已损坏」直接移入废纸篓——用户右键 → 打开即可放行。
  # 正式签名/公证为后续任务（见 README），当前不做。
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: '-'
dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - deb
    - AppImage
  category: Development
  icon: build/icons/512x512.png
  maintainer: "Deepseek Harness Desktop Contributors <deepseek-harness-desktop@users.noreply.github.com>"
# electron-builder 26 已移除顶层 notarize 选项：ad-hoc 签名不做公证
