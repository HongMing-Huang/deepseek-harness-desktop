appId: com.deepseek.dsh-desktop
productName: DSH Desktop
# 产物命名含平台与架构，便区分单架构包
artifactName: ${name}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/runtime
    to: runtime
    filter:
      - "**/*"
asar: true
asarUnpack: []
mac:
  category: public.app-category.developer-tools
  # arch 由 CLI（--arm64/--x64）控制，dist 脚本已按单架构瘦身运行时
  target:
    - dmg
    - zip
  icon: build/icon.icns
  # 签名/公证为后续任务：当前不签名、不公证
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
linux:
  target:
    - deb
    - AppImage
  category: Development
  icon: build/icons/512x512.png
  maintainer: "DSH Desktop Contributors <dsh-desktop@users.noreply.github.com>"
# electron-builder 26 已移除顶层 notarize 选项：未配置签名（identity: null）时公证不会执行
