<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>插件</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'"
    />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./plugins.css" />
  </head>
  <body>
    <main class="pane">
      <header class="pane__head">
        <h1 class="pane__title">插件管理</h1>
        <p class="pane__sub">安装到 dsh 的 web profile（~/.dsh/profiles/web）</p>
      </header>

      <!-- 区一：已安装 -->
      <section class="zone zone--installed">
        <div class="zone__head-row">
          <h2 class="zone__title">已安装 <span class="zone__count" id="installedCount">0</span></h2>
          <div class="zone__tools">
            <span class="zone__health" id="healthSummary" hidden></span>
            <button class="btn btn--ghost" id="healthBtn" type="button">检查健康</button>
          </div>
        </div>
        <div class="zone__scroll" id="installedList" role="list"></div>
      </section>

      <!-- 区二：目录 / dshfind 在线市场 -->
      <section class="zone zone--catalog">
        <div class="zone__head-row">
          <div class="zone__tabs" role="tablist">
            <button class="tab tab--active" id="tabCatalog" type="button" role="tab">
              精选目录 <span class="zone__count" id="catalogCount">0</span>
            </button>
            <button class="tab" id="tabMarket" type="button" role="tab">dshfind 市场</button>
          </div>
          <div class="zone__tools">
            <span class="zone__health" id="marketMeta" hidden></span>
            <button class="btn btn--ghost" id="marketRefreshBtn" type="button" hidden>
              刷新市场
            </button>
            <input
              class="input input--search"
              id="catalogSearch"
              type="search"
              placeholder="搜索名称 / 描述 / 分类…"
              autocomplete="off"
              spellcheck="false"
            />
            <input
              class="input input--search"
              id="marketSearch"
              type="search"
              placeholder="搜索 dshfind 插件 / 作者 / 描述…"
              autocomplete="off"
              spellcheck="false"
              hidden
            />
          </div>
        </div>
        <div class="zone__chips" id="catalogChips"></div>
        <div class="zone__scroll" id="catalogList" role="list"></div>
        <div class="zone__scroll" id="marketList" role="list" hidden></div>
      </section>

      <!-- 区三：进度区（订阅 OpProgress 的 plugin-install / plugin-remove） -->
      <footer class="progress" id="progressZone" hidden>
        <div class="progress__meta">
          <span class="progress__label" id="progressLabel">…</span>
          <button class="btn btn--restart" id="restartBtn" type="button" hidden>
            立即重启运行时
          </button>
        </div>
        <div class="progress__track">
          <div class="progress__beam" id="progressBeam"></div>
        </div>
      </footer>

      <!-- 官方生态链接（新窗口经主进程外链守卫走系统浏览器） -->
      <footer class="ecosystem">
        <span class="ecosystem__label">官方生态</span>
        <button class="link-btn" type="button" data-ext="https://github.com/deepseek-ai/deepseek-harness/blob/master/apps/cli/reference/README.md#plugin-management">插件管理文档</button>
        <button class="link-btn" type="button" data-ext="https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/architecture.md">架构说明</button>
        <button class="link-btn" type="button" data-ext="https://github.com/cordiverse/cordis">Cordis</button>
        <button class="link-btn" type="button" data-ext="https://dshfind.com/zh/plugins">dshfind 市场</button>
      </footer>
    </main>

    <script type="module" src="./plugins.js"></script>
  </body>
</html>
